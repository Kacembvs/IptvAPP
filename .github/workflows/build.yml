name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q iptv-tv-android.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Licences Android
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/licenses
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' | sudo tee /usr/local/lib/android/sdk/licenses/android-sdk-license
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-tv-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
